[package]
name = "soberano-lsfg-manager"
version = "1.0.0"
description = "Soberano LSFG Frame Generation Manager & Suite"
authors = ["JESUS"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1.0", features = ["full"] }

[lib]
name = "app_lib"
path = "src/lib.rs"

[[bin]]
name = "soberano-lsfg-manager"
path = "src/main.rs"
